name: Sign Android
description: Decodes a base64 keystore and writes key.properties for Gradle signing

inputs:
  keystore_base64:
    description: Base64-encoded .jks keystore file
    required: true
  keystore_password:
    required: true
  key_alias:
    required: true
  key_password:
    description: Key password. Optional — defaults to keystore_password (correct for PKCS12 keystores, which is keytool's default)
    required: false
    default: ''
  keystore_file:
    description: Where to write the keystore (relative to workspace)
    required: false
    default: android/app/upload-keystore.jks
  properties_file:
    description: Where to write key.properties (relative to workspace)
    required: false
    default: android/key.properties

runs:
  using: composite
  steps:
    - name: Validate signing inputs
      shell: bash
      env:
        IN_KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        IN_KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
        IN_KEY_ALIAS: ${{ inputs.key_alias }}
        IN_KEY_PASSWORD: ${{ inputs.key_password }}
      run: |
        missing=""
        [ -z "$IN_KEYSTORE_BASE64" ] && missing="$missing keystore_base64"
        [ -z "$IN_KEYSTORE_PASSWORD" ] && missing="$missing keystore_password"
        [ -z "$IN_KEY_ALIAS" ] && missing="$missing key_alias"
        if [ -n "$missing" ]; then
          echo "::error::sign-android is missing required inputs:$missing — check the repo secrets"
          exit 1
        fi

    - name: Decode keystore
      shell: bash
      env:
        IN_KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        IN_KEYSTORE_FILE: ${{ inputs.keystore_file }}
      run: |
        mkdir -p "$(dirname "${{ github.workspace }}/$IN_KEYSTORE_FILE")"
        echo "$IN_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/$IN_KEYSTORE_FILE"

    - name: Write key.properties
      shell: bash
      env:
        STORE_FILE: ${{ github.workspace }}/${{ inputs.keystore_file }}
        STORE_PASSWORD: ${{ inputs.keystore_password }}
        KEY_ALIAS: ${{ inputs.key_alias }}
        KEY_PASSWORD: ${{ inputs.key_password }}
        IN_PROPERTIES_FILE: ${{ inputs.properties_file }}
      run: |
        # PKCS12 (keytool default) shares the key password with the keystore
        KEY_PASSWORD_RESOLVED="${KEY_PASSWORD:-$STORE_PASSWORD}"
        mkdir -p "$(dirname "${{ github.workspace }}/$IN_PROPERTIES_FILE")"
        {
          echo "storeFile=$STORE_FILE"
          echo "storePassword=$STORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD_RESOLVED"
        } > "${{ github.workspace }}/$IN_PROPERTIES_FILE"
