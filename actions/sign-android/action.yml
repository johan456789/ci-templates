name: Sign Android
description: Signs built APKs (apksigner) and AABs (jarsigner) in place with a release keystore. Run it only in the release job, never in a job that also runs project code.

inputs:
  files:
    description: Space-separated paths or globs of .apk/.aab files to sign, e.g. dist/*.apk. A `-unsigned` suffix is dropped from signed file names.
    required: true
  keystore_base64:
    description: Base64-encoded keystore file (PKCS12 .p12, or legacy JKS)
    required: false
    default: ''
  keystore_password:
    required: false
    default: ''
  key_alias:
    description: Which key in the keystore to sign with. Optional when the keystore holds one key (as `just keystore-gen` makes); required when it holds several.
    required: false
    default: ''
  key_password:
    description: Key password. Optional — defaults to keystore_password (correct for PKCS12 keystores, which is keytool's default)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check signing inputs
      shell: bash
      env:
        IN_KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        IN_KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
      run: |
        missing=""
        [ -z "$IN_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
        [ -z "$IN_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
        if [ -n "$missing" ]; then
          echo "::error::Release signing is missing:$missing. Add them as secrets of the 'release' environment (Settings → Environments → release) and check that the calling workflow passes them under secrets: — refusing to publish an unsigned APK"
          exit 1
        fi

    - name: Sign
      shell: bash
      env:
        IN_KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        IN_KEY_ALIAS: ${{ inputs.key_alias }}
        # Passed to the signers via env:, never on the command line
        KS_PASS: ${{ inputs.keystore_password }}
        # PKCS12 (keytool default) shares the key password with the keystore
        KEY_PASS: ${{ inputs.key_password || inputs.keystore_password }}
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$sdk" ] || [ ! -d "$sdk/build-tools" ]; then
          echo "::error::Android SDK build-tools not found (ANDROID_HOME is unset); sign-android needs apksigner"
          exit 1
        fi
        # Newest build-tools: apksigner 35+ page-aligns native libs to 16 KB
        apksigner="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)/apksigner"
        jarsigner="${JAVA_HOME:+$JAVA_HOME/bin/}jarsigner"
        keytool="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"

        keystore="$RUNNER_TEMP/release-keystore.p12"
        trap 'rm -f "$keystore"' EXIT
        printf '%s' "$IN_KEYSTORE_BASE64" | base64 -d > "$keystore"

        alias="$IN_KEY_ALIAS"
        if [ -z "$alias" ]; then
          # No alias given: use the keystore's only key. English output so the
          # labels below parse whatever the runner's locale.
          if ! listing="$("$keytool" -J-Duser.language=en -list -v -keystore "$keystore" -storepass:env KS_PASS 2>&1)"; then
            echo "::error::Couldn't open the keystore — check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (${listing%%$'\n'*})"
            exit 1
          fi
          mapfile -t aliases < <(awk -F': ' '/^Alias name:/ { a = $2 } /^Entry type: PrivateKeyEntry/ { print a }' <<<"$listing")
          if [ "${#aliases[@]}" -ne 1 ]; then
            echo "::error::The keystore holds ${#aliases[@]} keys (${aliases[*]}); set ANDROID_KEY_ALIAS to pick one"
            exit 1
          fi
          alias="${aliases[0]}"
          echo "Signing with the keystore's only key: $alias"
        fi

        # Unquoted on purpose: expand the globs in FILES; drop globs with no match
        shopt -s nullglob
        # shellcheck disable=SC2086
        set -- $FILES
        if [ $# -eq 0 ]; then
          echo "::error::sign-android found no files matching: $FILES"
          exit 1
        fi

        for f in "$@"; do
          case "$f" in
            *.apk)
              out="${f%.apk}"; out="${out%-unsigned}.apk"
              # Replaces any existing (e.g. debug) signature
              "$apksigner" sign --ks "$keystore" --ks-key-alias "$alias" \
                --ks-pass env:KS_PASS --key-pass env:KEY_PASS --v4-signing-enabled false \
                --out "$out.tmp" "$f"
              rm -f "$f"
              mv "$out.tmp" "$out"
              "$apksigner" verify --print-certs "$out" | grep -m1 'SHA-256' | sed "s|^|$out: |"
              ;;
            *.aab)
              out="${f%.aab}"; out="${out%-unsigned}.aab"
              "$jarsigner" -keystore "$keystore" -storepass:env KS_PASS -keypass:env KEY_PASS \
                -signedjar "$out.tmp" "$f" "$alias" > /dev/null
              rm -f "$f"
              mv "$out.tmp" "$out"
              "$jarsigner" -verify "$out" > /dev/null
              echo "$out: signed"
              ;;
            *)
              echo "::error::sign-android can only sign .apk and .aab files: $f"
              exit 1
              ;;
          esac
        done
