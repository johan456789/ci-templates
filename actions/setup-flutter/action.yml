name: Setup Flutter
description: Installs the Flutter toolchain with pub caching, plus a JDK when java_version is set (Android builds only)

inputs:
  flutter_version:
    description: Pinned Flutter version (empty = latest stable)
    required: false
    default: ''
  java_version:
    description: Temurin JDK version to install (empty = no JDK; only Android builds need one)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      if: inputs.java_version != ''
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter_version == '' && '3.x' || inputs.flutter_version }}
        cache: true
