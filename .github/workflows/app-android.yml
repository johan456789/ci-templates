name: Android app

on:
  workflow_call:
    inputs:
      java_version:
        description: Temurin JDK version
        type: string
        required: false
        default: '17'
      gradle_task:
        description: Gradle task(s) to run, e.g. assembleRelease or bundleRelease
        type: string
        required: false
        default: assembleRelease
      project_dir:
        description: Directory containing gradlew (root for native Android projects)
        type: string
        required: false
        default: .
      prebuild_script:
        description: Shell command run after checkout (e.g. ./build_native_dep.sh). Empty = skip.
        type: string
        required: false
        default: ''
      prebuild_cache_path:
        description: Path the prebuild script produces; restored/saved via cache. Empty = no cache.
        type: string
        required: false
        default: ''
      prebuild_cache_key:
        description: Cache namespace for prebuild_cache_path. Required when prebuild_cache_path is set.
        type: string
        required: false
        default: ''
      prebuild_cache_hash_files:
        description: Optional file glob (evaluated post-checkout in the caller repo) appended to the cache key for auto-invalidation, e.g. the build script itself.
        type: string
        required: false
        default: ''
      publish_release:
        description: Sign the APK/AAB and attach it to a GitHub release when triggered by a v* tag
        type: boolean
        required: false
        default: true
      upload_artifact:
        description: Keep the built (unsigned) APK/AAB as a downloadable workflow artifact (for inspecting a PR or main build from the run page). Off by default because artifacts count against the account storage quota. Tagged releases always upload, since the release job needs them.
        type: boolean
        required: false
        default: false
    # Keep these in the app repo's `release` environment, not as repo secrets:
    # GitHub then fills them in only for the release job, on v* tags. The
    # caller must still pass them by name, or they resolve to empty here.
    # required: true catches a caller that forgets, on its first run instead of
    # its first tag. It only checks that the caller passes them, not that they
    # have a value, so PR builds still work.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        description: Optional; defaults to ANDROID_KEYSTORE_PASSWORD
        required: false

# NOTE: no concurrency here on purpose. In a called workflow github.workflow is the
# CALLER's name, so a fixed group would collide when one caller invokes multiple
# templates. Set concurrency in your app repo's thin workflow instead.

# Read-only by default: every job but release runs project code and
# dependencies. Without this, those jobs get whatever the caller grants.
permissions:
  contents: read

jobs:
  # Runs project code and dependencies, so it never sees the signing key and
  # produces an unsigned (or debug-signed) build. The release job signs it.
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.publish_release && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # pull_request_target runs with the base repo's secrets and a write token,
      # and is how outsider PR code usually gets hold of them
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::Don't call this workflow from pull_request_target: it runs with secrets. Use pull_request instead."
          exit 1

      - uses: actions/checkout@v7

      # Validate the gradle-wrapper.jar against official Gradle checksums. This
      # was provided by gradle/actions/setup-gradle (now removed); without it a
      # swapped/compromised wrapper JAR could execute arbitrary code on the runner.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      # Cache Gradle User Home (wrapper distribution + dependency caches) so the
      # app's wrapper-pinned Gradle isn't re-downloaded every run. We run
      # `./gradlew` directly rather than gradle/actions/setup-gradle because that
      # action provisions its OWN Gradle version (9.x) and ignores the repo's
      # wrapper -- which broke builds on repos pinned to an older Gradle.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          # Only caches + wrapper dist, NOT init.d/gradle.properties, so a
          # compromised build can't persist auto-executing config across runs.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}-

      # Optional pre-build hook for repos that aren't build-ready after
      # checkout (e.g. a gitignored native library compiled by a repo script).
      # All inputs default to empty = hook skipped, so existing callers that
      # pass nothing behave exactly as before.
      - name: Restore prebuild cache
        id: prebuild-cache
        if: inputs.prebuild_cache_path != '' && inputs.prebuild_cache_key != ''
        uses: actions/cache@v6
        with:
          path: ${{ inputs.prebuild_cache_path }}
          key: ${{ inputs.prebuild_cache_key }}-${{ inputs.prebuild_cache_hash_files != '' && hashFiles(inputs.prebuild_cache_hash_files) || 'v1' }}
          restore-keys: |
            ${{ inputs.prebuild_cache_key }}-

      - name: Run prebuild script
        if: inputs.prebuild_script != '' && (inputs.prebuild_cache_path == '' || steps.prebuild-cache.outputs.cache-hit != 'true')
        run: ${{ inputs.prebuild_script }}

      - name: Build
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: ./gradlew $GRADLE_TASK
        working-directory: ${{ inputs.project_dir }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -path '*/build/outputs/*' -not -path './dist/*' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload build artifact
        if: inputs.upload_artifact || env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The only job that sees the signing key, so it runs no project code: it
  # downloads the build, signs it and publishes.
  release:
    needs: build
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-build
          path: dist

      - name: Sign APK/AAB
        uses: johan456789/ci-templates/actions/sign-android@main
        with:
          files: dist/*.apk dist/*.aab
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: johan456789/ci-templates/actions/publish-release@main
        with:
          files: dist/*
