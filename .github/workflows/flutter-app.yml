name: Flutter app

on:
  workflow_call:
    inputs:
      flutter_version:
        description: Pinned Flutter version (empty = latest stable)
        type: string
        required: false
        default: ''
      java_version:
        type: string
        required: false
        default: '17'
      run_analyze:
        type: boolean
        required: false
        default: true
      run_test:
        type: boolean
        required: false
        default: true
      run_build_runner:
        description: Run `dart run build_runner build` before analyze/build (for codegen projects like envied)
        type: boolean
        required: false
        default: false
      prebuild_script:
        description: Optional shell command run after pub get, before codegen/build (e.g. write a gitignored .env from secrets). Empty = skipped.
        type: string
        required: false
        default: ''
      lfs:
        description: Fetch Git LFS files on checkout (e.g. LFS-tracked fonts or assets)
        type: boolean
        required: false
        default: false
      analyze_args:
        description: Extra arguments appended to `flutter analyze` (e.g. --no-fatal-infos)
        type: string
        required: false
        default: ''
      build_args:
        description: Extra arguments appended to `flutter build apk --release` (e.g. --dart-define-from-file=.env)
        type: string
        required: false
        default: ''
      check_tag_version:
        description: On v* tag builds, fail unless the tag (minus the leading v) equals the pubspec.yaml version (minus +build)
        type: boolean
        required: false
        default: true
      abi_splits:
        description: Build split-per-ABI APKs instead of one universal APK
        type: boolean
        required: false
        default: false
      publish_release:
        description: Attach APKs to a GitHub release when triggered by a v* tag
        type: boolean
        required: false
        default: true
      project_dir:
        description: Directory containing pubspec.yaml (repo root for most apps; set for monorepos, e.g. app)
        type: string
        required: false
        default: .
      upload_artifact:
        description: Keep the built APK as a downloadable workflow artifact (for sideloading a PR or main build from the run page). Off by default because artifacts count against the account storage quota. Tagged releases always upload.
        type: boolean
        required: false
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      DOTENV:
        description: Full .env file contents written to .env before codegen/build (for gitignored env vars)
        required: false

# NOTE: no concurrency here on purpose. In a called workflow github.workflow is the
# CALLER's name, so a fixed group would collide when one caller invokes multiple
# templates. Set concurrency in your app repo's thin workflow instead.

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}

      - uses: johan456789/ci-templates/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          java_version: ${{ inputs.java_version }}

      - uses: johan456789/ci-templates/actions/prepare-flutter@main
        with:
          project_dir: ${{ inputs.project_dir }}
          dotenv: ${{ secrets.DOTENV }}
          prebuild_script: ${{ inputs.prebuild_script }}
          run_build_runner: ${{ inputs.run_build_runner }}

      - name: Analyze
        if: inputs.run_analyze
        env:
          ANALYZE_ARGS: ${{ inputs.analyze_args }}
        run: |
          read -r -a extra <<< "$ANALYZE_ARGS"
          flutter analyze "${extra[@]}"

      - name: Test
        if: inputs.run_test
        run: flutter test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}

      - name: Check tag matches pubspec version
        if: inputs.check_tag_version && startsWith(github.ref, 'refs/tags/v')
        run: |
          # "version: 1.2.3+4" (optionally quoted) -> "1.2.3"
          pubspec_version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^+'\" #]+).*/\1/p" pubspec.yaml | head -n1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error file=pubspec.yaml::Tag $GITHUB_REF_NAME does not match pubspec.yaml version '$pubspec_version'. Bump pubspec.yaml and re-tag, or set check_tag_version: false."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec.yaml version $pubspec_version"

      - uses: johan456789/ci-templates/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          java_version: ${{ inputs.java_version }}

      - uses: johan456789/ci-templates/actions/prepare-flutter@main
        with:
          project_dir: ${{ inputs.project_dir }}
          dotenv: ${{ secrets.DOTENV }}
          prebuild_script: ${{ inputs.prebuild_script }}
          run_build_runner: ${{ inputs.run_build_runner }}

      # Skips itself when no signing secrets are set (unsigned CI build)
      - name: Configure Android signing
        uses: johan456789/ci-templates/actions/sign-android@main
        with:
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          keystore_file: ${{ inputs.project_dir }}/android/app/upload-keystore.jks
          properties_file: ${{ inputs.project_dir }}/android/key.properties

      - name: Build APK
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
          ABI_SPLITS: ${{ inputs.abi_splits }}
        run: |
          args=()
          [ "$ABI_SPLITS" = true ] && args+=(--split-per-abi)
          read -r -a extra <<< "$BUILD_ARGS"
          flutter build apk --release "${args[@]}" "${extra[@]}"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          ls -lh dist/

      - name: Upload build artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ inputs.project_dir }}/dist/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub release
        if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
        uses: johan456789/ci-templates/actions/publish-release@main
        with:
          files: ${{ inputs.project_dir }}/dist/*.apk
