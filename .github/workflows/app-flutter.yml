name: Flutter app

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of platforms to build, subset of ["android","linux","windows","macos"]
        type: string
        required: false
        default: '["android"]'
      flutter_version:
        description: Pinned Flutter version (empty = latest stable)
        type: string
        required: false
        default: ''
      project_dir:
        description: Directory containing pubspec.yaml (repo root for most apps; set for monorepos, e.g. app)
        type: string
        required: false
        default: .
      lfs:
        description: Fetch Git LFS files on checkout (e.g. LFS-tracked fonts or assets)
        type: boolean
        required: false
        default: false
      prebuild_script:
        description: Shell command run after pub get, before codegen/analyze/build, in every job. Empty = skipped.
        type: string
        required: false
        default: ''
      run_build_runner:
        description: Run `dart run build_runner build` before analyze/build (for codegen projects like envied)
        type: boolean
        required: false
        default: false
      run_analyze:
        description: Run `flutter analyze`
        type: boolean
        required: false
        default: true
      run_test:
        description: Run `flutter test`
        type: boolean
        required: false
        default: true
      analyze_args:
        description: Extra arguments appended to `flutter analyze` (e.g. --no-fatal-infos)
        type: string
        required: false
        default: ''
      check_tag_version:
        description: On v* tag builds, fail unless the tag (minus the leading v) equals the pubspec.yaml version (minus +build)
        type: boolean
        required: false
        default: true
      publish_release:
        description: Attach every platform's build to a GitHub release when triggered by a v* tag
        type: boolean
        required: false
        default: true
      upload_artifact:
        description: Keep the built files as downloadable workflow artifacts (for sideloading a PR or main build from the run page). Off by default because artifacts count against the account storage quota. Tagged releases always upload, since the release job needs them.
        type: boolean
        required: false
        default: false
      android_java_version:
        description: Temurin JDK version for the Android build
        type: string
        required: false
        default: '17'
      android_abi_splits:
        description: Build one APK per CPU architecture (arm64-v8a, armeabi-v7a, x86_64) instead of one universal APK
        type: boolean
        required: false
        default: false
      android_build_args:
        description: Extra arguments appended to `flutter build apk --release` (e.g. --dart-define-from-file=.env)
        type: string
        required: false
        default: ''
      linux_appimage_name:
        description: App name shown in launchers, docks and AppImage managers, e.g. My App. Linux builds always ship an AppImage, so this is required when platforms has "linux", unless linux_appimage_desktop_file is set.
        type: string
        required: false
        default: ''
      linux_appimage_categories:
        description: Freedesktop menu categories, e.g. Office; or Development;IDE; (https://specifications.freedesktop.org/menu-spec/latest/category-registry.html). Required when platforms has "linux", unless linux_appimage_desktop_file is set.
        type: string
        required: false
        default: ''
      linux_appimage_icon:
        description: AppImage icon (.png or .svg), relative to project_dir. Empty = the Android launcher icon (android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png).
        type: string
        required: false
        default: ''
      linux_appimage_desktop_file:
        description: Your own .desktop file for the AppImage, relative to project_dir, instead of linux_appimage_name and linux_appimage_categories. Empty = generate one named after APPLICATION_ID in linux/CMakeLists.txt.
        type: string
        required: false
        default: ''
    # Keep the ANDROID_* secrets in the app repo's `release` environment, not as
    # repo secrets: GitHub then fills them in only for the release job, on v*
    # tags. The caller must still pass them by name, or they resolve to empty
    # here. Not required: desktop-only apps have no signing key.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        description: Optional; only needed when the keystore holds more than one key
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      DOTENV:
        description: Full .env file contents written to .env before codegen/build (for gitignored env vars)
        required: false

# NOTE: no concurrency here on purpose. In a called workflow github.workflow is the
# CALLER's name, so a fixed group would collide when one caller invokes multiple
# templates. Set concurrency in your app repo's thin workflow instead.

# Read-only by default: every job but release runs project code and
# dependencies. Without this, those jobs get whatever the caller grants.
permissions:
  contents: read

jobs:
  # Validates inputs, splits platforms into per-job outputs, and decides once
  # whether this run is a release. Runs before every other job so a bad input,
  # a refused trigger or a tag/pubspec mismatch fails fast.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.context.outputs.android }}
      desktop_matrix: ${{ steps.context.outputs.desktop_matrix }}
      release: ${{ steps.context.outputs.release }}
    steps:
      # pull_request_target runs with the base repo's secrets and a write token,
      # and is how outsider PR code usually gets hold of them
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::Don't call this workflow from pull_request_target: it runs with secrets. Use pull_request instead."
          exit 1

      - id: context
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          LINUX_APPIMAGE_NAME: ${{ inputs.linux_appimage_name }}
          LINUX_APPIMAGE_CATEGORIES: ${{ inputs.linux_appimage_categories }}
          LINUX_APPIMAGE_DESKTOP_FILE: ${{ inputs.linux_appimage_desktop_file }}
        run: |
          if ! jq -e 'type == "array" and length > 0 and all(.[]; IN("android", "linux", "windows", "macos"))' <<<"$PLATFORMS" > /dev/null; then
            echo "::error::platforms must be a JSON array with values from: android, linux, windows, macos (got: $PLATFORMS)"
            exit 1
          fi
          # Linux builds always ship an AppImage, whose .desktop file needs these
          if jq -e 'index("linux") != null' <<<"$PLATFORMS" > /dev/null; then
            if [ -n "$LINUX_APPIMAGE_DESKTOP_FILE" ]; then
              if [ -n "$LINUX_APPIMAGE_NAME$LINUX_APPIMAGE_CATEGORIES" ]; then
                echo "::error::Set either linux_appimage_desktop_file or linux_appimage_name + linux_appimage_categories, not both"
                exit 1
              fi
            elif [ -z "$LINUX_APPIMAGE_NAME" ] || [ -z "$LINUX_APPIMAGE_CATEGORIES" ]; then
              echo "::error::Linux builds ship an AppImage, which needs linux_appimage_name and linux_appimage_categories (e.g. Office;), or linux_appimage_desktop_file"
              exit 1
            fi
          fi
          is_release_tag=false
          [[ "$GITHUB_REF" == refs/tags/v* ]] && is_release_tag=true
          release=false
          [ "$PUBLISH_RELEASE" = true ] && [ "$is_release_tag" = true ] && release=true
          {
            echo "android=$(jq 'index("android") != null' <<<"$PLATFORMS")"
            # Explicit {platform, os} pairs. A static matrix include list would ADD
            # every unmatched entry as a new job, building all desktop OSes.
            echo "desktop_matrix=$(jq -c 'map(select(. != "android")) | unique | map({platform: ., os: {linux: "ubuntu-latest", windows: "windows-latest", macos: "macos-latest"}[.]})' <<<"$PLATFORMS")"
            echo "is_release_tag=$is_release_tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: inputs.check_tag_version && steps.context.outputs.is_release_tag == 'true'

      - name: Check tag matches pubspec version
        if: inputs.check_tag_version && steps.context.outputs.is_release_tag == 'true'
        working-directory: ${{ inputs.project_dir }}
        run: |
          # "version: 1.2.3+4" (optionally quoted) -> "1.2.3"
          pubspec_version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^+'\" #]+).*/\1/p" pubspec.yaml | head -n1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error file=pubspec.yaml::Tag $GITHUB_REF_NAME does not match pubspec.yaml version '$pubspec_version'. Bump pubspec.yaml and re-tag, or set check_tag_version: false."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec.yaml version $pubspec_version"

  # Platform-independent checks, run once for every platform.
  test:
    needs: prepare
    if: inputs.run_analyze || inputs.run_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}

      - uses: johan456789/ci-templates/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}

      - uses: johan456789/ci-templates/actions/prepare-flutter@main
        with:
          project_dir: ${{ inputs.project_dir }}
          dotenv: ${{ secrets.DOTENV }}
          prebuild_script: ${{ inputs.prebuild_script }}
          run_build_runner: ${{ inputs.run_build_runner }}

      - name: Analyze
        if: inputs.run_analyze
        env:
          ANALYZE_ARGS: ${{ inputs.analyze_args }}
        run: |
          read -r -a extra <<< "$ANALYZE_ARGS"
          flutter analyze "${extra[@]}"

      - name: Test
        if: inputs.run_test
        run: flutter test

  build-android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}

      - uses: johan456789/ci-templates/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          java_version: ${{ inputs.android_java_version }}

      - uses: johan456789/ci-templates/actions/prepare-flutter@main
        with:
          project_dir: ${{ inputs.project_dir }}
          dotenv: ${{ secrets.DOTENV }}
          prebuild_script: ${{ inputs.prebuild_script }}
          run_build_runner: ${{ inputs.run_build_runner }}

      # Never signed with the release key here: this job runs project code and
      # dependencies. Without key.properties Flutter signs with the debug key;
      # the release job re-signs.
      - name: Build APK
        env:
          BUILD_ARGS: ${{ inputs.android_build_args }}
          ABI_SPLITS: ${{ inputs.android_abi_splits }}
        run: |
          args=()
          [ "$ABI_SPLITS" = true ] && args+=(--split-per-abi)
          read -r -a extra <<< "$BUILD_ARGS"
          flutter build apk --release "${args[@]}" "${extra[@]}"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          ls -lh dist/

      - name: Upload build artifact
        if: inputs.upload_artifact || needs.prepare.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: ${{ inputs.project_dir }}/dist/*.apk
          if-no-files-found: error
          retention-days: 3

  build-desktop:
    needs: prepare
    if: needs.prepare.outputs.desktop_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.lfs }}

      - uses: johan456789/ci-templates/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: johan456789/ci-templates/actions/prepare-flutter@main
        with:
          project_dir: ${{ inputs.project_dir }}
          dotenv: ${{ secrets.DOTENV }}
          prebuild_script: ${{ inputs.prebuild_script }}
          run_build_runner: ${{ inputs.run_build_runner }}

      - run: flutter build linux --release
        if: runner.os == 'Linux'

      - run: flutter build windows --release
        if: runner.os == 'Windows'

      - run: flutter build macos --release
        if: runner.os == 'macOS'

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ github.event.repository.name }}-linux-x64.tar.gz" -C build/linux/x64/release bundle

      - id: appimage
        name: Prepare AppImage inputs (linux)
        if: runner.os == 'Linux'
        env:
          ICON: ${{ inputs.linux_appimage_icon }}
          DESKTOP_FILE: ${{ inputs.linux_appimage_desktop_file }}
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          # The tag on release builds (it's what AppImage managers compare the
          # installed version against); pubspec.yaml's version otherwise
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^+'\" #]+).*/\1/p" pubspec.yaml | head -n1)
          fi
          app_id=$(sed -nE 's/^[[:space:]]*set\(APPLICATION_ID "([^"]+)"\).*/\1/p' linux/CMakeLists.txt | head -n1)
          icon="${ICON:-android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png}"
          if [ ! -f "$icon" ]; then
            echo "::error::AppImage icon '$icon' not found in $PROJECT_DIR; set linux_appimage_icon"
            exit 1
          fi
          # The action runs from the workspace root, not project_dir
          {
            echo "version=$version"
            echo "app_id=$app_id"
            echo "icon=$PROJECT_DIR/$icon"
            if [ -n "$DESKTOP_FILE" ]; then
              echo "desktop_file=$PROJECT_DIR/$DESKTOP_FILE"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Package AppImage (linux)
        if: runner.os == 'Linux'
        uses: johan456789/ci-templates/actions/package-appimage@main
        with:
          dir: ${{ inputs.project_dir }}/build/linux/x64/release/bundle
          name: ${{ github.event.repository.name }}
          display_name: ${{ inputs.linux_appimage_name }}
          categories: ${{ inputs.linux_appimage_categories }}
          version: ${{ steps.appimage.outputs.version }}
          icon: ${{ steps.appimage.outputs.icon }}
          app_id: ${{ steps.appimage.outputs.app_id }}
          desktop_file: ${{ steps.appimage.outputs.desktop_file }}
          output_dir: ${{ inputs.project_dir }}/dist

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/${{ github.event.repository.name }}-windows-x64.zip"

      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app "dist/${{ github.event.repository.name }}-macos.zip"

      - name: Upload build artifact
        if: inputs.upload_artifact || needs.prepare.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: ${{ inputs.project_dir }}/dist/*
          if-no-files-found: error
          retention-days: 3

  # One release for all platforms, only once tests and every requested build
  # pass. !cancelled() is needed because unselected platforms' build jobs are
  # skipped, and by default a skipped dependency skips this job too.
  # The only job that sees the signing key, so it runs no project code: it
  # downloads the builds, signs the APKs and publishes.
  release:
    needs: [prepare, test, build-android, build-desktop]
    if: >-
      !cancelled()
      && needs.prepare.outputs.release == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Sign APKs
        if: needs.prepare.outputs.android == 'true'
        uses: johan456789/ci-templates/actions/sign-android@main
        with:
          files: dist/*.apk
          keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: johan456789/ci-templates/actions/publish-release@main
        with:
          files: dist/*
