name: Desktop app

on:
  workflow_call:
    inputs:
      flutter_version:
        description: Pinned Flutter version (empty = latest stable)
        type: string
        required: false
        default: ''
      java_version:
        type: string
        required: false
        default: '17'
      platforms_json:
        description: JSON array of platforms to build, subset of ["linux","windows","macos"]
        type: string
        required: false
        default: '["linux"]'
      publish_release:
        description: Attach packages to a GitHub release when triggered by a v* tag
        type: boolean
        required: false
        default: true
      upload_artifact:
        description: Keep the built files as downloadable workflow artifacts (for sideloading a PR or main build from the run page). Off by default because artifacts count against the account storage quota. Tagged releases always upload, since the release job needs them.
        type: boolean
        required: false
        default: false
      project_dir:
        description: Directory containing pubspec.yaml (repo root for most apps; set for monorepos, e.g. app)
        type: string
        required: false
        default: .

# NOTE: no concurrency here on purpose. In a called workflow github.workflow is the
# CALLER's name, so a fixed group would collide when one caller invokes multiple
# templates. Set concurrency in your app repo's thin workflow instead.

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set-platforms.outputs.platforms }}
    steps:
      - id: set-platforms
        env:
          PLATFORMS_JSON: ${{ inputs.platforms_json }}
        run: |
          if ! jq -e 'type == "array" and length > 0 and all(.[]; IN("linux", "windows", "macos"))' <<<"$PLATFORMS_JSON" > /dev/null; then
            echo "::error::platforms_json must be a JSON array with values from: linux, windows, macos (got: $PLATFORMS_JSON)"
            exit 1
          fi
          echo "platforms=$(jq -c 'unique' <<<"$PLATFORMS_JSON")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ inputs.project_dir }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: johan456789/ci-templates/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          java_version: ${{ inputs.java_version }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter build linux --release
        if: runner.os == 'Linux'

      - run: flutter build windows --release
        if: runner.os == 'Windows'

      - run: flutter build macos --release
        if: runner.os == 'macOS'

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ github.event.repository.name }}-linux-x64.tar.gz" -C build/linux/x64/release bundle

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/${{ github.event.repository.name }}-windows-x64.zip"

      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app "dist/${{ github.event.repository.name }}-macos.zip"

      - name: Upload build artifact
        if: inputs.upload_artifact || (inputs.publish_release && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: ${{ inputs.project_dir }}/dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: johan456789/ci-templates/actions/publish-release@main
        with:
          files: dist/*
