name: Desktop app

on:
  workflow_call:
    inputs:
      flutter_version:
        description: Pinned Flutter version (empty = latest stable)
        type: string
        required: false
        default: ''
      java_version:
        type: string
        required: false
        default: '17'
      platforms_json:
        description: JSON array of platforms to build, subset of ["linux","windows","macos"]
        type: string
        required: false
        default: '["linux"]'
      publish_release:
        description: Attach packages to a GitHub release when triggered by a v* tag
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set-platforms.outputs.platforms }}
    steps:
      - id: set-platforms
        env:
          PLATFORMS_JSON: ${{ inputs.platforms_json }}
        run: |
          echo "platforms=$PLATFORMS_JSON" >> "$GITHUB_OUTPUT"

  build:
    # NOTE: macOS runners consume minutes at 10x on private repos
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./actions/setup-flutter
        with:
          flutter_version: ${{ inputs.flutter_version }}
          java_version: ${{ inputs.java_version }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter build linux --release
        if: runner.os == 'Linux'

      - run: flutter build windows --release
        if: runner.os == 'Windows'

      - run: flutter build macos --release
        if: runner.os == 'macOS'

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ github.event.repository.name }}-linux-x64.tar.gz" -C build/linux/x64/release bundle

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/${{ github.event.repository.name }}-windows-x64.zip"

      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app "dist/${{ github.event.repository.name }}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist/
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
